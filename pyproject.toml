[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "token-reduce"
version = "0.1.0"
description = "Universal token optimization for AI coding assistants — 80-95% input + 50-75% output savings"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Mustafaraza89" }]
license = { text = "MIT" }
keywords = ["ai", "tokens", "context", "knowledge-graph", "developer-tools", "cli", "claude", "cursor", "gemini", "copilot"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = []

[project.scripts]
token-reduce = "token_reduce.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["token_reduce*"]
